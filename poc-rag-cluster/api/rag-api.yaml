apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-rag-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-rag-api
  template:
    metadata:
      labels:
        app: redis-rag-api
    spec:
      containers:
        - name: api
          image: redis-rag-api:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: REDIS_HOST
              value: "redis-stack"
            - name: REDIS_PORT
              value: "6379"
---
apiVersion: v1
kind: Service
metadata:
  name: redis-rag-api
spec:
  type: NodePort
  selector:
    app: redis-rag-api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30007